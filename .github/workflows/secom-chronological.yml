name: SECOM chronological sensitivity evaluation
on:
  push:
    paths:
      - '.github/workflows/secom-chronological.yml'
      - 'real_models/evaluate_secom_chrono.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chronological:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Evaluate temporal split
        run: python -m real_models.evaluate_secom_chrono
      - name: Commit reproducible chronological result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f real_models/evidence/secom_chronological_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record measured retrospective SECOM chronological evaluation'
            git push origin HEAD:main
          fi
      - name: Save original timestamp-split evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secom-chronological-evidence
          path: real_models/evidence/secom_chronological_report.json
          if-no-files-found: warn
          retention-days: 60
