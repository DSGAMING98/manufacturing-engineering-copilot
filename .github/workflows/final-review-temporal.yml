name: "Final review - temporal seed and five-model diagnostics"
on:
  push:
    paths:
      - '.github/workflows/final-review-temporal.yml'
      - 'real_models/final_review_temporal_models.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research packages
        run: python -m pip install -r requirements-research.txt
      - name: Run 15 chrono seeds, five model families and block-width CIs
        run: python -m real_models.final_review_temporal_models
      - name: Archive exact experimental output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add real_models/evidence/final_review_temporal_models.json
          git commit -m 'evidence: archive final-review temporal-model comparisons' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve downloadable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-review-temporal-models
          path: real_models/evidence/final_review_temporal_models.json
          if-no-files-found: warn
          retention-days: 60
