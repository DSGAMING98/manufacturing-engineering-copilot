name: Observed-data model and engineering regressions
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CPU-only verification
        run: python -m phase6.reproduce
      - name: Compile all sources
        run: python -m compileall -q src phase4 phase5 phase6 phase7 real_models
# CI verifies the committed observed-data artifact and evidence. Re-training is a
# separate reproducibility run because it downloads the original UCI archives.
