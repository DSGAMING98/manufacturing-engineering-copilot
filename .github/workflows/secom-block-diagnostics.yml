name: "SECOM time-block and decision diagnostics"
on:
  push:
    paths:
      - '.github/workflows/secom-block-diagnostics.yml'
      - 'real_models/secom_block_diagnostics.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run block, missingness and threshold diagnostics
        run: python -m real_models.secom_block_diagnostics
      - name: Save raw measured evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add real_models/evidence/secom_block_diagnostics.json
          git commit -m 'evidence: archive post-hoc SECOM time-block mechanism diagnostics' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secom-block-diagnostics-report
          path: real_models/evidence/secom_block_diagnostics.json
          if-no-files-found: warn
          retention-days: 60
