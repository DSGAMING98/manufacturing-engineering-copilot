name: "SECOM raw temporal prevalence audit"
on:
  push:
    paths:
      - '.github/workflows/secom-prevalence.yml'
      - 'real_models/audit_temporal_prevalence.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research requirements
        run: python -m pip install -r requirements-research.txt
      - name: Verify dated labels and publish time-block evidence
        run: python -m real_models.audit_temporal_prevalence
      - name: Commit source-verified JSON evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add real_models/evidence/secom_temporal_prevalence.json
          git commit -m 'evidence: archive raw-label temporal prevalence verification' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload independent audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secom-prevalence-audit
          path: real_models/evidence/secom_temporal_prevalence.json
          retention-days: 60
          if-no-files-found: warn
