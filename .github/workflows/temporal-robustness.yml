name: SECOM robustness: 50 seeds and rolling origin
on:
  push:
    paths:
      - '.github/workflows/temporal-robustness.yml'
      - 'real_models/temporal_robustness_review.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  temporal-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run fifty random splits, rolling origins and block CI
        run: python -m real_models.temporal_robustness_review
      - name: Archive verified evidence in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add real_models/evidence/temporal_robustness_report.json
          git commit -m 'evidence: record temporal robustness distribution and rolling windows' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload machine-readable evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-robustness-report
          path: real_models/evidence/temporal_robustness_report.json
          retention-days: 60
          if-no-files-found: warn
